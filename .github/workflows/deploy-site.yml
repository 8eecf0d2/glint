name: Deploy marketing site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glint-site-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare static assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CI: true
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --workspace glint-site run typecheck
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Build and deploy
        run: npm run deploy:site
